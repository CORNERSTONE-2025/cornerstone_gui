# CORNERSTONE GUI with Docker Compose.
#
#   docker compose up --build -d     # build and start, then open http://localhost:8501
#   docker compose logs -f           # follow the logs
#   docker compose down              # stop (the workspace volume is kept)
#
# Real data: download it from the Data page (the Parquet store is kept in the `db` volume, folder
# datastore/), or use a folder of this computer with CORNERSTONE_DATA_DIR (e.g. in a .env file next
# to this one). A database of the former dump (cornerstone.sqlite) in that folder can be imported
# from the Data page. Without data the GUI starts in demo mode on synthetic data.
services:
  gui:
    build:
      context: .
      args:
        CORNERSTONE_REF: ${CORNERSTONE_REF:-main}
    image: cornerstone-gui:latest
    ports:
      # only reachable from this computer; remove "127.0.0.1:" to expose it on the network
      - "127.0.0.1:${CS_GUI_PORT:-8501}:8501"
    environment:
      CS_GUI_LEGACY_DB: /data/${CORNERSTONE_DB_FILE:-cornerstone.sqlite}
    volumes:
      - workspace:/workspace
      # a name (default `db`, the volume of earlier versions) is a Docker volume, a path is a folder
      # of this computer. Writable: the data updates write datastore/ there; the GUI only reads it
      - ${CORNERSTONE_DATA_DIR:-${CORNERSTONE_DB_DIR:-db}}:/data
    # PyTorch data loaders and the package multiprocessing pools use shared memory
    shm_size: "2gb"
    restart: unless-stopped

volumes:
  workspace:
  db:
