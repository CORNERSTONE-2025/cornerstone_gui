# CORNERSTONE GUI with Docker Compose.
#
#   docker compose up --build -d     # build and start, then open http://localhost:8501
#   docker compose logs -f           # follow the logs
#   docker compose down              # stop (the workspace volume is kept)
#
# Real data: download the database from the Home page (it is kept in the `db` volume), or use a
# database you already have by setting CORNERSTONE_DB_DIR / CORNERSTONE_DB_FILE (e.g. in a .env
# file next to this one). Without a database the GUI starts in demo mode on synthetic data.
services:
  gui:
    build:
      context: .
      args:
        CORNERSTONE_REF: ${CORNERSTONE_REF:-main}
    image: cornerstone-gui:latest
    ports:
      # only reachable from this computer; remove "127.0.0.1:" to expose it on the network
      - "127.0.0.1:${CS_GUI_PORT:-8501}:8501"
    environment:
      CS_GUI_DB_PATH: /data/${CORNERSTONE_DB_FILE:-cornerstone.sqlite}
    volumes:
      - workspace:/workspace
      # a name (default `db`) is a Docker volume, a path is a folder of this computer. Writable:
      # the database download writes there; the GUI itself opens the database read-only
      - ${CORNERSTONE_DB_DIR:-db}:/data
    # PyTorch data loaders and the package multiprocessing pools use shared memory
    shm_size: "2gb"
    restart: unless-stopped

volumes:
  workspace:
  db:
